  </header>

  <main id="main" class="playpage">
    <div class="play-card">
      <nav class="crumbs" id="playCrumbs" aria-label="Breadcrumb"></nav>
      <div class="play__bar">
        <button type="button" class="play__back" id="playBack" hidden aria-label="Back">←</button>
        <h1 id="playTitle">Playground</h1>
        <button type="button" class="play__back" id="playSound" aria-pressed="true" aria-label="Turn sound off">🔊</button>
      </div>
      <div class="play__body" id="playBody"></div>
    </div>
  </main>

  <!-- reSHAPTCHA minigame: slot the hero shapes, get a meme -->
  <dialog class="game" id="game" aria-labelledby="gameTitle">
    <div class="game__head">
      <p class="game__kicker" data-cap="kicker">Security check</p>
      <h2 id="gameTitle" data-cap="title">Put every shape into its slot</h2>
      <p class="game__hint" data-cap="hint">Drag them into the slots (or tap a shape, then a slot) and hit Verify.</p>
    </div>
    <div class="game__play" id="gamePlay">
      <div class="game__slots" id="gameSlots"></div>
      <div class="game__tray" id="gameTray"></div>
    </div>
    <p class="game__msg" id="gameMsg" role="status"></p>
    <div class="game__win" id="gameWin" hidden>
      <figure class="meme">
        <img src="assets/img/meme-success.jpg" alt="Success Kid meme: You did it!" width="476" height="314">
      </figure>
      <p class="game__verdict" id="gameVerdict"></p>
    </div>
    <div class="game__foot">
      <span class="captcha__brand"><span class="captcha__logo" aria-hidden="true">↻</span>reSHAPTCHA</span>
      <span class="game__actions">
        <button class="game__close" id="gameClose" type="button" data-cap="close">Close</button>
        <button class="game__verify" id="gameVerify" type="button" disabled data-cap="verify">Verify</button>
      </span>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="play-shell.js?v=15"></script>
  <script src="guess-data.js?v=3"></script>
  <script src="captcha.js?v=5"></script>
  <script src="orchestra.js?v=43"></script>
  <script src="tower.js?v=14"></script>
  <script src="words-data.js?v=1"></script>
  <script src="words-valid.js?v=1"></script>
  <script src="words.js?v=3"></script>
  <script src="liars.js?v=3"></script>
  <script src="price.js?v=6"></script>
  <script src="twotruths.js?v=4"></script>
  <script src="play.js?v=39"></script>
</body>
</html>
